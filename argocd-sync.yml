name: ArgoCD Sync

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, qa, staging, production]
      action:
        description: "Action to perform"
        required: true
        type: choice
        options: [sync, rollback]

jobs:
  argocd:
    name: ArgoCD ${{ inputs.action }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # triggers approval gate for staging/prod

    steps:
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Sync Application
        if: inputs.action == 'sync'
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          argocd app sync sellerportal-consignment-${{ inputs.environment }} \
            --grpc-web --timeout 120
          argocd app wait sellerportal-consignment-${{ inputs.environment }} \
            --health --timeout 300

      - name: Rollback Application
        if: inputs.action == 'rollback'
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          argocd app rollback sellerportal-consignment-${{ inputs.environment }} \
            --grpc-web
          argocd app wait sellerportal-consignment-${{ inputs.environment }} \
            --health --timeout 300

      - name: Print app status
        if: always()
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          argocd app get sellerportal-consignment-${{ inputs.environment }} \
            --grpc-web || true

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} ArgoCD ${{ inputs.action }} *sellerportal-consignment* [${{ inputs.environment }}] ${{ job.status }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
