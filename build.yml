name: Build & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            aws_account: "902309182575"
            role_secret: AWS_ROLE_ARN_DEV
          - environment: qa
            aws_account: "101532331542"
            role_secret: AWS_ROLE_ARN_QA
          - environment: stg
            aws_account: "495925322840"
            role_secret: AWS_ROLE_ARN_STG
          - environment: prd
            aws_account: "335133004674"
            role_secret: AWS_ROLE_ARN_PRD

    permissions:
      id-token: write   # required for OIDC
      contents: write   # required to push kustomize tag updates

    steps:
      # ── Checkout ────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Node / npm build ────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Build application
        run: npm run build -- --mode ${{ matrix.environment }}
        env:
          VITE_ENVIRONMENT: ${{ matrix.environment }}
          FONTAWESOME_AUTHTOKEN: ${{ secrets.FONTAWESOME_AUTHTOKEN }}

      # ── AWS credentials (OIDC) ──────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[matrix.role_secret] }}
          aws-region: us-east-1

      # ── Phase A: S3 / CloudFront deploy (dev & qa auto) ─────
      - name: Sync to S3
        if: github.ref == 'refs/heads/main'
        run: |
          BUCKET_SECRET="S3_BUCKET_${{ matrix.environment == 'stg' && 'STG' || matrix.environment == 'prd' && 'PRD' || upper(matrix.environment) }}"
          aws s3 sync dist/ s3://${{ secrets[format('S3_BUCKET_{0}', matrix.environment == 'stg' && 'STG' || matrix.environment == 'prd' && 'PRD' || matrix.environment)] }} \
            --delete --cache-control "max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html \
            s3://${{ secrets[format('S3_BUCKET_{0}', matrix.environment)] }}/index.html \
            --cache-control "no-store"

      - name: Invalidate CloudFront
        if: github.ref == 'refs/heads/main'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets[format('CF_DIST_{0}', matrix.environment)] }} \
            --paths "/*"

      # ── Phase B: Docker / ECR ───────────────────────────────
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ matrix.environment }}-${{ github.sha }}
        run: |
          docker build \
            --build-arg ENVIRONMENT=${{ matrix.environment }} \
            --build-arg FONTAWESOME_AUTHTOKEN=${{ secrets.FONTAWESOME_AUTHTOKEN }} \
            --tag $ECR_REGISTRY/sellerportal-consignment:$IMAGE_TAG \
            --tag $ECR_REGISTRY/sellerportal-consignment:${{ matrix.environment }}-latest \
            --file app/Dockerfile.production \
            .
          docker push $ECR_REGISTRY/sellerportal-consignment:$IMAGE_TAG
          docker push $ECR_REGISTRY/sellerportal-consignment:${{ matrix.environment }}-latest

      # ── Update Kustomize image tag in git (GitOps) ──────────
      - name: Update Kustomize image tag
        if: github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ matrix.environment }}-${{ github.sha }}
          OVERLAY: ${{ matrix.environment == 'stg' && 'staging' || matrix.environment == 'prd' && 'production' || matrix.environment }}
        run: |
          curl -sL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          cd k8s/overlays/$OVERLAY
          ../../../kustomize edit set image \
            sellerportal-consignment=$ECR_REGISTRY/sellerportal-consignment:$IMAGE_TAG

      - name: Commit & push image tag update
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/*/kustomization.yaml
          git diff --staged --quiet || \
            (git commit -m "ci: update image tag [${{ matrix.environment }}] ${{ github.sha }}" \
             && git pull --rebase && git push)

      # ── Slack notification ───────────────────────────────────
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *sellerportal-consignment* [${{ matrix.environment }}] build ${{ job.status }}",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "${{ job.status == 'success' && '✅' || '❌' }} *sellerportal-consignment* `${{ matrix.environment }}` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                }
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
