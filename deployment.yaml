apiVersion: apps/v1
kind: Deployment
metadata:
  name: sellerportal-consignment
  labels:
    app: sellerportal-consignment
spec:
  replicas: 2                         # overridden per-env via overlay
  selector:
    matchLabels:
      app: sellerportal-consignment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0               # zero-downtime rollout
  template:
    metadata:
      labels:
        app: sellerportal-consignment
    spec:
      containers:
        - name: consignment
          image: sellerportal-consignment:latest   # replaced by kustomize
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: sellerportal-consignment-config
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
